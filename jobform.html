<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            smooth-scroll: smooth;
            background-color: lightblue;
            h2 {
                color: black;
                font-family: Arial, sans-serif;
            }
            form{
                background-color: rgb(70, 100, 167);
                padding: 60px;
                border-radius: 20px;
                width: 400px;
                margin: 0 auto;
                input, textarea{
                    width: 100%;
                    padding: 10px;
                    margin-bottom: 20px;
                    border: 1px solid #ccc;
                    border-radius: 5px;
                }
            }
        }
    </style>
</head>
<body>
    <form>
        <h1>Job Application Form</h1>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required><br><br>
        <label for="address">Address:</label>
        <input type="text" id="address" name="address" row="3" required><br><br>
        <label for="position">Position Applied For:</label>
        <input type="text" id="position" name="position" required><br><br>
        <label for="resume">Upload Resume:</label>
        <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required><br><br>
        <label for="experience">Work Experience:</label>
        <input type="text" id="experience" name="experience" required><br><br>
        <label for="coverletter">Cover Letter:</label>
        <textarea id="coverletter" name="coverletter" rows="4" cols="50" required></textarea><br><br>
        <input type="submit" value="Submit">
        
    </form>
</body>
</html>
